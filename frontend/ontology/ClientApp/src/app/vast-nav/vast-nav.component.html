<section [class.sidenav]="isExpanded" [class.sidenav-small]="!isExpanded">
  <div class="toggle">
    @if (isExpanded) {
      <img (click)="toggleMenu.emit(null)" src="/assets/logo/vast.png" srcset="/assets/logo/vast@2x.png 2x,/assets/logo/vast@3x.png 3x" class="logo" alt="VAST Platform" />
    }
    @if (!isExpanded) {
      <mat-icon class="expand-button" (click)="toggleMenu.emit(null)">arrow_forward</mat-icon>
    }
  </div>
  <hr />
  <mat-list class="nav">
    <a mat-list-item href="#login"
      class="hover"
      (click)="goToPlatform()">
      <mat-icon mat-list-icon
        [matTooltip]="!isExpanded ? 'Back to platform' : ''"
        matTooltipPosition="right">
        arrow_back
      </mat-icon>
      @if (isExpanded) {
        <p matLine>Back to Platform</p>
      }
    </a>
  </mat-list>
  @for (route of routeLinks; track route) {
    <mat-list class="nav">
      <a mat-list-item
        routerLinkActive="active-link"
        class="hover"
        routerLink="{{ route.link }}">
        <mat-icon mat-list-icon
          [matTooltip]="!isExpanded ? route.name : ''"
          matTooltipPosition="right">
          {{ route.icon }}
        </mat-icon>
        @if (isExpanded) {
          <p matLine>{{ route.name }}</p>
        }
      </a>
    </mat-list>
  }
