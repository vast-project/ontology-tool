<div class="dashboard">
  <h1>Dashboard</h1>
  <div class="primary-tiles">
    @for (tile of dataTiles; track tile) {
      <a class="tile"><span class="title">{{ tile.title }}</span><span class="subtitle">{{ tile.subtitle }}</span><div class="data">@for (dataItem of tile.data; track dataItem) {
      <span class="data">{{ dataItem }}</span>
    }</div></a>
  }
</div>
